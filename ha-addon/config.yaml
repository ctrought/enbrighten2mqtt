# Home Assistant add-on manifest. It runs the SAME published image as the
# standalone container; `version` is the image tag the Supervisor pulls, so bump
# it to match each release (and set `image` to your published repo). The image
# reads these options from /data/options.json on start (see hassio.py).
name: Enbrighten2MQTT
version: "0.2.3"
slug: enbrighten2mqtt
description: Local LAN control of Enbrighten Eternity (Tuya) lights via MQTT
url: https://github.com/ctrought/enbrighten2mqtt
image: ghcr.io/ctrought/enbrighten2mqtt
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Required: Tuya LAN discovery is a UDP broadcast and control is TCP on the
# device subnet, so the add-on must share the host network.
host_network: true
init: false
map:
  - addon_config:rw        # optional: drop your own oem.json here to override
services:
  - mqtt:want              # auto-use Home Assistant's Mosquitto broker if present
options:
  enbrighten_email: ""
  enbrighten_password: ""
  device_refresh: if_missing
  log_level: info
  mqtt_host: ""            # leave blank to use the Home Assistant MQTT service
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
schema:
  enbrighten_email: str
  enbrighten_password: password
  device_refresh: list(if_missing|always|never)
  log_level: list(debug|info|warning|error)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_pass: password?
