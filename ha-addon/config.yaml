name: Enbrighten2MQTT
version: "0.1.0"
slug: enbrighten2mqtt
description: Local LAN control of Enbrighten Eternity (Tuya) lights via MQTT
arch: [aarch64, amd64]
startup: application
boot: auto
host_network: true          # needed for Tuya LAN discovery/control (UDP/TCP 6668)
map: [config:rw]
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_pass: password?
